[package]
name = "vessel-mcp"
version = "0.1.1"
description = "stdio bridge to the Vessel desktop app's local MCP server, for MCP clients that only speak stdio."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "io-util"] }

[lints]
workspace = true
