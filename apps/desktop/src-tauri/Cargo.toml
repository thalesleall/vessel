[package]
name = "vessel-desktop"
version = "0.1.11"
description = "Vessel desktop app: local terminals, SSH and encrypted self-hosted sync."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "vessel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vessel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aws-sdk-ec2 = { version = "1.281.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-sts = { version = "1.126.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-ssm = { version = "1.137.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1.5.3", features = ["rustls-aws-lc"] }
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
futures-util = "0.3.34"
portable-pty = "0.9.0"
russh = "0.65.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strip-ansi-escapes = "0.2.1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "v7", "serde"] }
vessel-client = { path = "../../../crates/vessel-client" }
vessel-crypto = { path = "../../../crates/vessel-crypto" }

[lints]
workspace = true
