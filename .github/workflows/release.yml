name: Release

# Publica um Release com o instalador do Windows quando uma tag v* é enviada:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão da tag confere com o app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $app = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($app -ne $tag) { throw "A tag v$tag não confere com a versão do app ($app) em tauri.conf.json" }

      - name: Chave do atualizador
        # Cada versão é assinada com a chave do atualizador (independente do certificado do
        # Windows). Sem ela, os apps instalados não aceitariam esta versão.
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:KEY) { throw "Falta o segredo TAURI_SIGNING_PRIVATE_KEY (veja docs/OPERATING.md, seção Atualizações)" }
          $pub = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if ($pub -notmatch '^[A-Za-z0-9+/=]{40,}$') { throw "A chave pública do atualizador não está em tauri.conf.json (plugins.updater.pubkey)" }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Ponte MCP (vai dentro do instalador)
        shell: pwsh
        run: |
          cargo build --release --locked -p vessel-mcp
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item target/release/vessel-mcp.exe apps/desktop/src-tauri/binaries/vessel-mcp-x86_64-pc-windows-msvc.exe

      - name: Instalador
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.json

      - name: Arquivos do release
        id: files
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          # O instalador desta versão, pelo nome: a pasta pode guardar builds anteriores (cache).
          $installer = "target/release/bundle/nsis/Vessel_${version}_x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Instalador $installer não encontrado" }
          if (-not (Test-Path "$installer.sig")) { throw "Assinatura do atualizador $installer.sig não encontrada" }
          Copy-Item $installer "out/Vessel_${version}_x64-setup.exe"
          Copy-Item target/release/vessel-mcp.exe "out/vessel-mcp_${version}_x64.exe"
          # Feed do atualizador: a versão nova, onde baixá-la e a assinatura do instalador.
          $sig = (Get-Content "$installer.sig" -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/Vessel_${version}_x64-setup.exe"
          $feed = [ordered]@{
            version = $version
            notes = "Novidades: https://github.com/${{ github.repository }}/releases/tag/v$version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{ "windows-x86_64" = [ordered]@{ signature = $sig; url = $url } }
          }
          [IO.File]::WriteAllText("$PWD/out/latest.json", ($feed | ConvertTo-Json -Depth 5))
          # Licenças dos pacotes de terceiros incluídos nos binários.
          Copy-Item THIRD-PARTY-NOTICES.md out/THIRD-PARTY-NOTICES.md
          # LF line endings, so `sha256sum -c SHA256SUMS.txt` works as is.
          $sums = Get-ChildItem out/* | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText("$PWD/out/SHA256SUMS.txt", ($sums -join "`n") + "`n")
          Get-Content out/SHA256SUMS.txt
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: vessel-windows
          path: out/*

      - name: Publicar o release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vessel ${{ steps.files.outputs.version }}
          files: out/*
          generate_release_notes: true
          body: |
            ## Instalar no Windows

            1. Baixe **Vessel_${{ steps.files.outputs.version }}_x64-setup.exe** abaixo e abra.
            2. O instalador não precisa de administrador: instala só para o seu usuário.
            3. Abra o **Vessel** pelo menu Iniciar e escolha **Só neste computador** ou **Sincronizar com um servidor**.

            O instalador ainda não é assinado digitalmente. Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo**. Para conferir o arquivo, compare o SHA-256 com `SHA256SUMS.txt`.

            Quem já tem o Vessel 0.1.2 ou mais novo recebe o aviso desta versão no próprio app.

            A ponte MCP para agentes de IA (`vessel-mcp.exe`) já vem no instalador; o arquivo avulso abaixo é para quem quiser usá-la em outro lugar.

            O servidor de sincronização (opcional) roda em Docker: veja `docs/OPERATING.md`.
