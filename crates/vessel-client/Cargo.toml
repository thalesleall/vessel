[package]
name = "vessel-client"
version = "0.1.0"
description = "Vessel client core: account, local encrypted store, sync engine, vault sharing."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v7", "serde"] }
vessel-crypto = { path = "../vessel-crypto" }
vessel-model = { path = "../vessel-model" }
vessel-protocol = { path = "../vessel-protocol" }

[dev-dependencies]
vessel-agent = { path = "../../apps/agent" }

[lints]
workspace = true
