# Vessel agent + Caddy (automatic HTTPS).
#
#   cp .env.example .env    # set VESSEL_DOMAIN
#   docker compose up -d
#
# The first account created on the server becomes its administrator.

services:
  agent:
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    image: vessel-agent:latest
    restart: unless-stopped
    environment:
      VESSEL_PUBLIC_URL: https://${VESSEL_DOMAIN}
      VESSEL_SIGNUPS: ${VESSEL_SIGNUPS:-invite-only}
      VESSEL_NAME: ${VESSEL_NAME:-Vessel}
      VESSEL_TRUST_PROXY: "true"
      VESSEL_BOOTSTRAP_TOKEN: ${VESSEL_BOOTSTRAP_TOKEN:-}
      VESSEL_VAULT_INVITE_SIGNUPS: ${VESSEL_VAULT_INVITE_SIGNUPS:-true}
      VESSEL_QUOTA_MB: ${VESSEL_QUOTA_MB:-0}
      VESSEL_MAX_VAULTS: ${VESSEL_MAX_VAULTS:-0}
    volumes:
      - vessel-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    restart: unless-stopped
    depends_on: [agent]
    ports:
      - "80:80"
      - "443:443"
    environment:
      VESSEL_DOMAIN: ${VESSEL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  vessel-data:
  caddy-data:
  caddy-config:
